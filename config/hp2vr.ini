; Experimental local integration; headset calibration remains required.
[VR]
UnitsPerMetre=50
EyeHeightOffset=-5
SnapTurnDegrees=30
WandLengthMetres=0.28
DominantHand=right

; Stick response and turning. snap is the default; smooth is optional.
StickDeadzone=0.20
MovementSpeed=1.0
TurnMode=snap
SmoothTurnDegreesPerSecond=90

; Grip-pose-local correction. Handle centre is at the controller grip by default.
WandOffsetRightMetres=0
WandOffsetUpMetres=0
WandOffsetForwardMetres=0
WandPitchDegrees=-15.563
WandYawDegrees=0
WandRollDegrees=0
; Original projectile or successful quicksave; 0 disables vibration.
HapticStrength=0.45

; Original HUD on transparent VR panel, updated at most 30 Hz.
HudEnabled=1
HudWidthMetres=1.35
